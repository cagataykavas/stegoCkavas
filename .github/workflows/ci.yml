name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"
      - name: Compile all modules
        run: python -m compileall -q stego_ai scripts tests run.py
      - name: Zero-dataset integration demo
        run: python -m stego_ai demo --output-dir demo_output --message "CI round trip"
      - name: Unit tests
        run: pytest

