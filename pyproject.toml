[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stego-ai-lab"
version = "0.1.0"
description = "Reproducible image steganography, steganalysis, and explanation tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
analysis = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "Pillow>=10.0",
  "scikit-learn>=1.4",
]
boost = [
  "lightgbm>=4.3",
  "xgboost>=2.0",
]
deep = [
  "Pillow>=10.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "scikit-learn>=1.4",
]

[project.scripts]
stego-lab = "stego_ai.cli:main"

[tool.setuptools.packages.find]
include = ["stego_ai*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

